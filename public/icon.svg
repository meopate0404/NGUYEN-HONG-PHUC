<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1917"/>
      <stop offset="50%" stop-color="#0c0a09"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="100" fill="url(#bgGrad)"/>
  <rect width="500" height="500" x="6" y="6" rx="94" fill="none" stroke="url(#redGrad)" stroke-width="8"/>
  
  <!-- Glowing rings -->
  <circle cx="256" cy="220" r="160" fill="none" stroke="#ef4444" stroke-width="2" opacity="0.3"/>
  <circle cx="256" cy="220" r="190" fill="none" stroke="#fbbf24" stroke-width="1.5" opacity="0.2"/>

  <!-- Microphone Head -->
  <g transform="translate(256,210) rotate(-25) translate(-256,-210)">
    <!-- Mic grille cap -->
    <rect x="220" y="110" width="72" height="110" rx="36" fill="url(#redGrad)"/>
    <line x1="220" y1="140" x2="292" y2="140" stroke="#fca5a5" stroke-width="3"/>
    <line x1="220" y1="165" x2="292" y2="165" stroke="#fca5a5" stroke-width="3"/>
    <line x1="220" y1="190" x2="292" y2="190" stroke="#fca5a5" stroke-width="3"/>
    <line x1="240" y1="110" x2="240" y2="220" stroke="#fca5a5" stroke-width="3"/>
    <line x1="272" y1="110" x2="272" y2="220" stroke="#fca5a5" stroke-width="3"/>

    <!-- Mic Ring Collar -->
    <rect x="214" y="218" width="84" height="14" rx="4" fill="url(#goldGrad)"/>

    <!-- Mic Body -->
    <path d="M224 232 L232 340 C233 346 238 350 244 350 L268 350 C274 350 279 346 280 340 L288 232 Z" fill="#292524" stroke="#44403c" stroke-width="2"/>
    
    <!-- On/Off switch -->
    <rect x="250" y="260" width="12" height="24" rx="3" fill="#1c1917"/>
    <circle cx="256" cy="268" r="4" fill="#22c55e"/>

    <!-- Mic base -->
    <rect x="242" y="350" width="28" height="20" rx="4" fill="#1c1917"/>
  </g>

  <!-- Musical notes -->
  <path d="M110 180 Q120 150 140 160 T145 195 A14 14 0 1 1 125 185 L125 145 Q150 135 160 150" fill="#fbbf24"/>
  <path d="M370 140 Q390 120 410 135 T415 170 A14 14 0 1 1 395 160 L395 120 Q420 110 430 125" fill="#ef4444"/>

  <!-- Brand Typography -->
  <text x="256" y="420" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="34" fill="#ffffff" text-anchor="middle" letter-spacing="3">OANH ĐIỀN</text>
  <text x="256" y="460" font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="22" fill="#ef4444" text-anchor="middle" letter-spacing="6">KARAOKE TV</text>
</svg>
